<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お祭りスタンプラリー</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; background: #fdfbf7; margin: 0; padding: 15px; color: #333; }
    h1 { font-size: 1.3rem; color: #d9534f; margin-bottom: 10px; }
    
    /* カメラ表示領域 */
    #reader-wrapper { display: none; width: 280px; margin: 10px auto; border: 3px solid #0275d8; border-radius: 12px; overflow: hidden; background: #000; }
    #reader { width: 100%; }

    /* スタンプ横並び */
    .stamp-container { display: flex; justify-content: center; gap: 8px; margin: 20px auto; }
    .spot {
      width: 48px; height: 48px; border-radius: 50%;
      background: #e0e0e0; border: 2px solid #ccc; display: flex;
      align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; color: #888;
      transition: all 0.3s ease;
    }

    /* 各スポットの点灯カラー */
    .spot-1.active { background: #ff4d4d; border-color: #cc0000; color: #fff; box-shadow: 0 0 8px rgba(255,77,77,0.6); transform: scale(1.08); }
    .spot-2.active { background: #3399ff; border-color: #0066cc; color: #fff; box-shadow: 0 0 8px rgba(51,153,255,0.6); transform: scale(1.08); }
    .spot-3.active { background: #2ed573; border-color: #11998e; color: #fff; box-shadow: 0 0 8px rgba(46,213,115,0.6); transform: scale(1.08); }
    .spot-4.active { background: #ffa502; border-color: #eccc68; color: #fff; box-shadow: 0 0 8px rgba(255,165,2,0.6); transform: scale(1.08); }
    .spot-5.active { background: #a55eea; border-color: #8854d0; color: #fff; box-shadow: 0 0 8px rgba(165,94,234,0.6); transform: scale(1.08); }

    .btn-action { background: #0275d8; color: white; border: none; padding: 14px 28px; font-size: 1rem; font-weight: bold; border-radius: 25px; margin: 10px auto; cursor: pointer; }
    #status-text { font-size: 1rem; font-weight: bold; margin: 10px 0; }
    
    /* スクラッチ・景品エリア */
    #ticket-screen { display: none; margin-top: 15px; }
    .scratch-container { position: relative; width: 280px; height: 160px; margin: 15px auto; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    
    /* 削った下に現れるカード */
    .scratch-behind {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #fff3cd; border: 2px dashed #ffebaa; box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .scratch-behind h3 { margin: 0; color: #856404; font-size: 1.2rem; }
    .scratch-behind p { margin: 5px 0 0; color: #666; font-size: 0.85rem; }

    /* 上にかぶせるキャンバス */
    #scratch-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; touch-action: none; }

    #completed-screen { display: none; margin-top: 50px; font-size: 1.2rem; color: #28a745; font-weight: bold; }
  </style>
</head>
<body>

  <!-- メイン画面（スタンプ帳） -->
  <div id="main-screen">
    <h1>🏮 お祭りスタンプラリー 🏮</h1>

    <!-- 1. カメラ表示画面 -->
    <div id="reader-wrapper"><div id="reader"></div></div>

    <!-- 2. カメラ起動ボタン -->
    <button class="btn-action" id="start-cam-btn" onclick="startCamera()">📷 カメラを起動する</button>

    <!-- 3. 横並びスタンプ -->
    <div class="stamp-container">
      <div id="spot-1" class="spot spot-1">①</div>
      <div id="spot-2" class="spot spot-2">②</div>
      <div id="spot-3" class="spot spot-3">③</div>
      <div id="spot-4" class="spot spot-4">④</div>
      <div id="spot-5" class="spot spot-5">⑤</div>
    </div>

    <p id="status-text">現在 0 / 5 個獲得</p>
  </div>

  <!-- スクラッチ達成画面 -->
  <div id="ticket-screen">
    <h1>🎉 スタンプコンプリート！ 🎉</h1>
    <p style="font-weight:bold; color:#d9534f; font-size:1.1rem;">指でこすって特典をゲットしよう！</p>
    
    <div class="scratch-container">
      <div class="scratch-behind">
        <h3>🎁 ガチャガチャ引換券 🎁</h3>
        <p>景品交換所でスタッフに見せてね</p>
      </div>
      <canvas id="scratch-canvas" width="280" height="160"></canvas>
    </div>

    <button class="btn-action" id="redeem-btn" style="background:#d9534f; margin-top: 20px; display:none;" onclick="completeRedeem()">使用済みにする</button>
  </div>

  <!-- 完了画面 -->
  <div id="completed-screen">✅ 引換が完了しました。<br><br>ご参加ありがとうございました！</div>

  <script>
    // ★ご自身のGASのWEBアプリURLに書き換えてください★
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxPKCWqiGosCQOd15_isRm1nHo7JgOW6yoZxY9DWxHYj3RkZU017zTGsNlGnIShuS2Mjw/exec";

    let userId = localStorage.getItem('fest_user_id') || 'U_' + Math.random().toString(36).substring(2, 9);
    localStorage.setItem('fest_user_id', userId);
    let visitedSpots = JSON.parse(localStorage.getItem('fest_visited') || '[]');
    let isRedeemed = localStorage.getItem('fest_redeemed') === 'true';
    let html5QrCode = null;
    let canScan = false;

    window.onload = function() {
      if (isRedeemed) { showEndScreen(); return; }
      updateUI();
    };

    function updateUI() {
      visitedSpots.forEach(s => { document.getElementById('spot-' + s)?.classList.add('active'); });
      document.getElementById('status-text').innerText = `現在 ${visitedSpots.length} / 5 個獲得`;
      
      // 5個揃ったらメイン画面を隠してスクラッチ画面に自動切替
      if (visitedSpots.length >= 5) {
        stopCamera();
        document.getElementById('main-screen').style.display = 'none';
        document.getElementById('ticket-screen').style.display = 'block';
        window.scrollTo(0, 0); // 画面一番上へスクロール
        initScratch();
      }
    }

    function startCamera() {
      document.getElementById('reader-wrapper').style.display = 'block';
      document.getElementById('start-cam-btn').style.display = 'none';
      
      canScan = false;
      
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start({ facingMode: "environment" }, { fps: 15, aspectRatio: 1.0 }, onScanSuccess)
      .then(() => {
        setTimeout(() => {
          canScan = true;
        }, 2000);
      });
    }

    function stopCamera() {
      canScan = false;
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => { 
          document.getElementById('reader-wrapper').style.display = 'none'; 
          document.getElementById('start-cam-btn').style.display = 'inline-block';
        }).catch(err => console.error(err));
      } else {
        document.getElementById('reader-wrapper').style.display = 'none';
        document.getElementById('start-cam-btn').style.display = 'inline-block';
      }
    }

    function onScanSuccess(decodedText) {
      if (!canScan) return;

      let spotMatch = decodedText.match(/(?:SPOT_)?([1-5])/i);
      if (spotMatch) {
        canScan = false;
        let spotNum = spotMatch[1];
        if (!visitedSpots.includes(spotNum)) {
          visitedSpots.push(spotNum);
          localStorage.setItem('fest_visited', JSON.stringify(visitedSpots));
          
          stopCamera();

          // スプレッドシートへ送信
          fetch(GAS_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "checkIn", userId: userId, spot: spotNum, visitedSpots: visitedSpots })
          });

          // 5個目の場合はアラートを出した後に自動切り替え
          if (visitedSpots.length >= 5) {
            alert(`🎉 読み取り完了！\n最後のスタンプを獲得しました！`);
          } else {
            alert(`🎉 読み取り完了！\nスポット ${spotNum} のスタンプを獲得しました！`);
          }
          
          updateUI();
        } else {
          stopCamera();
          alert(`スポット ${spotNum} はすでに獲得済みです。`);
        }
      }
    }

    /* --- スクラッチ機能 --- */
    let scratchInitialized = false;
    function initScratch() {
      if (scratchInitialized) return;
      scratchInitialized = true;

      const canvas = document.getElementById('scratch-canvas');
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#C0C0C0';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#666';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ここをこすってね！', canvas.width / 2, canvas.height / 2 + 6);

      let isDrawing = false;

      function scratch(e) {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, 20, 0, Math.PI * 2);
        ctx.fill();

        document.getElementById('redeem-btn').style.display = 'inline-block';
      }

      canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
      canvas.addEventListener('mousemove', scratch);
      window.addEventListener('mouseup', () => { isDrawing = false; });

      canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
      canvas.addEventListener('touchmove', scratch);
      window.addEventListener('touchend', () => { isDrawing = false; });
    }

    function completeRedeem() {
      if (confirm("スタッフ確認用：本当に使用済みにしますか？")) {
        localStorage.setItem('fest_redeemed', 'true');
        fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "redeem", userId: userId })
        });
        showEndScreen();
      }
    }

    function showEndScreen() {
      document.getElementById('main-screen').style.display = 'none';
      document.getElementById('ticket-screen').style.display = 'none';
      document.getElementById('completed-screen').style.display = 'block';
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
